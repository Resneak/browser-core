<!doctype html>
<meta charset="utf-8">
<title>browser-core-native-multicontext-pending</title>
<script>
  const wasmBytes = new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0]);

  async function drain(response) {
    const reader = response.body.getReader();
    while (!(await reader.read()).done) {}
  }

  async function exerciseBYOB() {
    const stream = new ReadableStream({
      type: "bytes",
      start(controller) {
        controller.enqueue(new Uint8Array([0x62, 0x63]));
        controller.close();
      },
    });
    const reader = stream.getReader({ mode: "byob" });
    const chunk = await reader.read(new Uint8Array(8));
    if (chunk.done || chunk.value.byteLength !== 2) {
      throw new Error("unexpected BYOB chunk");
    }
    const closed = await reader.read(new Uint8Array(8));
    if (!closed.done) throw new Error("BYOB stream did not close");
  }

  async function exerciseBodyConsumers() {
    const consumers = [
      () => new Response("array-buffer").arrayBuffer(),
      () => new Response("blob").blob(),
      () => new Response("bytes").bytes(),
      () => new Response("probe=body", {
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
      }).formData(),
      () => new Response("{}").json(),
      () => new Response("text").text(),
    ];
    for (const consume of consumers) await consume();
  }

  async function exerciseMainContext() {
    const canvas = document.createElement("canvas");
    canvas.width = 17;
    canvas.height = 19;
    canvas.getContext("2d").fillRect(1, 1, 3, 5);
    canvas.toDataURL();

    const channel = new MessageChannel();
    const received = new Promise((resolve) => {
      channel.port2.onmessage = resolve;
    });
    channel.port1.postMessage({ role: "main" });
    await received;

    await crypto.subtle.digest("SHA-256", new TextEncoder().encode("main"));
    await WebAssembly.compile(wasmBytes);
    await exerciseBYOB();
    await exerciseBodyConsumers();
    await fetch("data:text/plain,browser-core-private-payload");
    await drain(await fetch("/probe?role=main"));
  }

  async function waitForFrame() {
    const frameSignal = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("frame timeout")), 15000);
      addEventListener("message", (event) => {
        if (event.data !== "browser-core-frame-ok") return;
        clearTimeout(timer);
        resolve();
      }, { once: true });
    });
    const channel = new MessageChannel();
    const portSignal = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("frame port timeout")), 15000);
      channel.port1.onmessage = (event) => {
        if (event.data !== "browser-core-frame-port-ok") return;
        clearTimeout(timer);
        resolve();
      };
    });
    const frame = document.createElement("iframe");
    frame.src = `http://localhost:${location.port}/frame.html`;
    const loaded = new Promise((resolve) => frame.addEventListener("load", resolve, { once: true }));
    document.body.append(frame);
    await loaded;
    frame.contentWindow.postMessage(
      "browser-core-port",
      `http://localhost:${location.port}`,
      [channel.port2],
    );
    await Promise.all([frameSignal, portSignal]);
  }

  async function waitForWorker() {
    const worker = new Worker("/worker.js");
    const workerSignal = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("worker timeout")), 15000);
      worker.onerror = (event) => reject(new Error(event.message));
      worker.onmessage = (event) => {
        if (event.data !== "browser-core-worker-ok") return;
        clearTimeout(timer);
        resolve();
      };
    });
    const channel = new MessageChannel();
    const portSignal = new Promise((resolve, reject) => {
      const timer = setTimeout(() => reject(new Error("worker port timeout")), 15000);
      channel.port1.onmessage = (event) => {
        if (event.data !== "browser-core-worker-port-ok") return;
        clearTimeout(timer);
        resolve();
      };
    });
    worker.postMessage("browser-core-port", [channel.port2]);
    await Promise.all([workerSignal, portSignal]);
    worker.terminate();
  }

  addEventListener("DOMContentLoaded", async () => {
    try {
      await Promise.all([exerciseMainContext(), waitForFrame(), waitForWorker()]);
      document.title = "browser-core-native-multicontext-ok";
    } catch (error) {
      document.title = `browser-core-native-multicontext-failed:${error.name}`;
    }
  });
</script>
